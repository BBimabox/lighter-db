<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="打火機年份真偽辨識證據鏈">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2225"/><stop offset="1" stop-color="#101214"/></linearGradient><style>.t{font:700 30px Arial,'Noto Sans TC',sans-serif;fill:#f2d177}.s{font:600 22px Arial,'Noto Sans TC',sans-serif;fill:#e7eaec}.m{font:500 18px Arial,'Noto Sans TC',sans-serif;fill:#b8c0c5}.line{stroke:#d4b55e;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}.soft{stroke:#6e7a80;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.box{fill:#20272b;stroke:#465258;stroke-width:3}.accent{fill:#d4b55e}.muted{fill:#6e7a80}</style></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><text x="60" y="70" class="t">年份 / 真偽辨識：建立證據鏈</text><g transform="translate(80 140)"><rect width="1040" height="350" rx="22" class="box"/><g class="s"><text x="70" y="90">Logo</text><text x="275" y="90">底印</text><text x="480" y="90">機構</text><text x="685" y="90">材質</text><text x="890" y="90">年代</text></g><g class="accent"><circle cx="100" cy="170" r="28"/><circle cx="305" cy="170" r="28"/><circle cx="510" cy="170" r="28"/><circle cx="715" cy="170" r="28"/><circle cx="920" cy="170" r="28"/></g><path d="M128 170h149M333 170h149M538 170h149M743 170h149" class="line"/><text x="160" y="285" class="m">所有特徵應在同一品牌、型號與年代上互相吻合</text></g></svg>