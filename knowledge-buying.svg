<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="中古打火機購買前檢查">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2225"/><stop offset="1" stop-color="#101214"/></linearGradient><style>.t{font:700 30px Arial,'Noto Sans TC',sans-serif;fill:#f2d177}.s{font:600 22px Arial,'Noto Sans TC',sans-serif;fill:#e7eaec}.m{font:500 18px Arial,'Noto Sans TC',sans-serif;fill:#b8c0c5}.line{stroke:#d4b55e;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}.soft{stroke:#6e7a80;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.box{fill:#20272b;stroke:#465258;stroke-width:3}.accent{fill:#d4b55e}.muted{fill:#6e7a80}</style></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><text x="60" y="70" class="t">中古購買前照片檢查</text><g transform="translate(80 135)"><rect width="1040" height="370" rx="22" class="box"/><g transform="translate(65 55)"><rect width="190" height="120" rx="14" fill="#15191b" stroke="#d4b55e" stroke-width="4"/><text x="48" y="70" class="s">正 / 背面</text></g><g transform="translate(300 55)"><rect width="190" height="120" rx="14" fill="#15191b" stroke="#d4b55e" stroke-width="4"/><text x="62" y="70" class="s">底印</text></g><g transform="translate(535 55)"><rect width="190" height="120" rx="14" fill="#15191b" stroke="#d4b55e" stroke-width="4"/><text x="62" y="70" class="s">鉸鏈</text></g><g transform="translate(770 55)"><rect width="190" height="120" rx="14" fill="#15191b" stroke="#d4b55e" stroke-width="4"/><text x="43" y="70" class="s">點火機構</text></g><text x="70" y="260" class="m">再補：加油 / 加氣口、螺絲、序號與完整操作影片</text><text x="70" y="310" class="m">只問「能不能點火」遠遠不夠。</text></g></svg>