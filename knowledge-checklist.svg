<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="打火機收藏檢查表">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2225"/><stop offset="1" stop-color="#101214"/></linearGradient><style>.t{font:700 30px Arial,'Noto Sans TC',sans-serif;fill:#f2d177}.s{font:600 22px Arial,'Noto Sans TC',sans-serif;fill:#e7eaec}.m{font:500 18px Arial,'Noto Sans TC',sans-serif;fill:#b8c0c5}.line{stroke:#d4b55e;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}.soft{stroke:#6e7a80;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.box{fill:#20272b;stroke:#465258;stroke-width:3}.accent{fill:#d4b55e}.muted{fill:#6e7a80}</style></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><text x="60" y="70" class="t">30 秒收藏檢查表</text><g transform="translate(80 135)"><rect width="1040" height="390" rx="22" class="box"/><g class="s"><text x="80" y="80">① 名稱 / Logo</text><text x="80" y="135">② 結構 / 燃料</text><text x="80" y="190">③ 底印 / 專利 / 序號</text><text x="80" y="245">④ 品相 / 缺件 / 修復</text><text x="80" y="300">⑤ 查證資料庫 / 型錄 / 專利</text><text x="80" y="355">⑥ 留照片 / 網址 / 價格 / 判斷</text></g><g transform="translate(720 70)"><rect width="210" height="245" rx="18" fill="#15191b" stroke="#6e7a80" stroke-width="4"/><path d="M760 125h125M760 175h125M760 225h125M760 275h90" class="line"/><circle cx="745" cy="125" r="8" class="accent"/><circle cx="745" cy="175" r="8" class="accent"/><circle cx="745" cy="225" r="8" class="accent"/><circle cx="745" cy="275" r="8" class="accent"/></g></g></svg>