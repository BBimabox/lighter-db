<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="打火機收藏價值判斷">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2225"/><stop offset="1" stop-color="#101214"/></linearGradient><style>.t{font:700 30px Arial,'Noto Sans TC',sans-serif;fill:#f2d177}.s{font:600 22px Arial,'Noto Sans TC',sans-serif;fill:#e7eaec}.m{font:500 18px Arial,'Noto Sans TC',sans-serif;fill:#b8c0c5}.line{stroke:#d4b55e;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}.soft{stroke:#6e7a80;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.box{fill:#20272b;stroke:#465258;stroke-width:3}.accent{fill:#d4b55e}.muted{fill:#6e7a80}</style></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><text x="60" y="70" class="t">收藏價值怎麼看</text><g transform="translate(95 145)"><circle cx="180" cy="170" r="120" fill="#232a2e" stroke="#d4b55e" stroke-width="6"/><text x="130" y="160" class="s">型號</text><text x="118" y="205" class="m">Mechanism</text><circle cx="500" cy="170" r="120" fill="#232a2e" stroke="#6e7a80" stroke-width="6"/><text x="450" y="160" class="s">年代</text><text x="437" y="205" class="m">Dating</text><circle cx="820" cy="170" r="120" fill="#232a2e" stroke="#d4b55e" stroke-width="6"/><text x="745" y="160" class="s">原裝度</text><text x="738" y="205" class="m">Originality</text><path d="M300 170h80M620 170h80" class="line"/><text x="348" y="380" class="m">品牌只是入口，真正價值來自多項條件一起看</text></g></svg>