<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="打火機保養流程">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2225"/><stop offset="1" stop-color="#101214"/></linearGradient><style>.t{font:700 30px Arial,'Noto Sans TC',sans-serif;fill:#f2d177}.s{font:600 22px Arial,'Noto Sans TC',sans-serif;fill:#e7eaec}.m{font:500 18px Arial,'Noto Sans TC',sans-serif;fill:#b8c0c5}.line{stroke:#d4b55e;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}.soft{stroke:#6e7a80;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.box{fill:#20272b;stroke:#465258;stroke-width:3}.accent{fill:#d4b55e}.muted{fill:#6e7a80}</style></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><text x="60" y="70" class="t">日常保養流程</text><g transform="translate(80 150)"><rect width="1040" height="340" rx="22" class="box"/><g transform="translate(50 65)"><circle cx="70" cy="70" r="55" fill="#2b3438" stroke="#d4b55e" stroke-width="5"/><text x="45" y="80" class="s">1</text><text x="145" y="60" class="s">先辨識燃料系統</text><text x="145" y="95" class="m">Petrol / Butane 不要混用</text></g><g transform="translate(390 65)"><circle cx="70" cy="70" r="55" fill="#2b3438" stroke="#d4b55e" stroke-width="5"/><text x="45" y="80" class="s">2</text><text x="145" y="60" class="s">處理耗材與阻塞</text><text x="145" y="95" class="m">火石、棉芯、火輪、閥門</text></g><g transform="translate(730 65)"><circle cx="70" cy="70" r="55" fill="#2b3438" stroke="#d4b55e" stroke-width="5"/><text x="45" y="80" class="s">3</text><text x="145" y="60" class="s">輕清潔、少拋光</text><text x="145" y="95" class="m">保留鍍層、刻字與 patina</text></g></g></svg>