<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="打火機機構類型辨識">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2225"/><stop offset="1" stop-color="#101214"/></linearGradient><style>.t{font:700 30px Arial,'Noto Sans TC',sans-serif;fill:#f2d177}.s{font:600 22px Arial,'Noto Sans TC',sans-serif;fill:#e7eaec}.m{font:500 18px Arial,'Noto Sans TC',sans-serif;fill:#b8c0c5}.line{stroke:#d4b55e;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}.soft{stroke:#6e7a80;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.box{fill:#20272b;stroke:#465258;stroke-width:3}.accent{fill:#d4b55e}.muted{fill:#6e7a80}</style></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><text x="55" y="60" class="t">機構 / 類型速辨</text>
