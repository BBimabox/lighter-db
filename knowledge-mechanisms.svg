<g transform="translate(615 105)"><rect width="260" height="440" rx="20" class="box"/><text x="25" y="45" class="s">Automatic</text><rect x="65" y="160" width="125" height="180" rx="16" class="box"/><path d="M65 160l45-70h80" class="line"/><circle cx="175" cy="105" r="27" class="soft"/><path d="M175 133v55" class="line"/><path d="M35 250h55" class="line"/><polygon points="95,250 72,236 72,264" class="accent"/><text x="40" y="385" class="m">單一操作連動開蓋＋點火</text></g>
