<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="打火機安全原則">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2225"/><stop offset="1" stop-color="#101214"/></linearGradient><style>.t{font:700 30px Arial,'Noto Sans TC',sans-serif;fill:#f2d177}.s{font:600 22px Arial,'Noto Sans TC',sans-serif;fill:#e7eaec}.m{font:500 18px Arial,'Noto Sans TC',sans-serif;fill:#b8c0c5}.line{stroke:#d4b55e;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}.soft{stroke:#6e7a80;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.box{fill:#20272b;stroke:#465258;stroke-width:3}.accent{fill:#d4b55e}.muted{fill:#6e7a80}</style></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><text x="60" y="70" class="t">安全原則</text><g transform="translate(95 145)"><rect width="1010" height="330" rx="22" class="box"/><path d="M120 250l70-150 70 150z" fill="#3a2b18" stroke="#e6c261" stroke-width="6"/><text x="173" y="215" class="s">!</text><text x="330" y="105" class="s">補油 / 加氣遠離火源</text><text x="330" y="165" class="s">疑似漏氣立即停用</text><text x="330" y="225" class="s">不熟悉的高壓 / 古董機構不要強拆</text><text x="330" y="285" class="s">展示與存放都要避開高溫</text></g></svg>