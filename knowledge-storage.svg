<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="打火機長期收藏保存">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2225"/><stop offset="1" stop-color="#101214"/></linearGradient><style>.t{font:700 30px Arial,'Noto Sans TC',sans-serif;fill:#f2d177}.s{font:600 22px Arial,'Noto Sans TC',sans-serif;fill:#e7eaec}.m{font:500 18px Arial,'Noto Sans TC',sans-serif;fill:#b8c0c5}.line{stroke:#d4b55e;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}.soft{stroke:#6e7a80;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.box{fill:#20272b;stroke:#465258;stroke-width:3}.accent{fill:#d4b55e}.muted{fill:#6e7a80}</style></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><text x="60" y="70" class="t">長期收藏與保存</text><g transform="translate(100 145)"><rect x="0" y="0" width="1000" height="340" rx="24" class="box"/><rect x="90" y="90" width="220" height="170" rx="18" fill="#252d31" stroke="#6e7a80" stroke-width="4"/><rect x="140" y="130" width="120" height="90" rx="12" fill="#1a1f22" stroke="#d4b55e" stroke-width="4"/><path d="M200 130v-40" class="line"/><text x="85" y="300" class="m">乾燥收納 / 避熱避曬</text><path d="M430 90h180v170H430z" fill="#252d31" stroke="#6e7a80" stroke-width="4"/><path d="M455 120h130v110H455z" fill="#131719" stroke="#d4b55e" stroke-width="4"/><text x="425" y="300" class="m">原盒、說明書、配件分開保存</text><rect x="735" y="95" width="160" height="150" rx="16" fill="#252d31" stroke="#6e7a80" stroke-width="4"/><circle cx="815" cy="170" r="42" class="soft"/><path d="M780 170h70M815 135v70" class="line"/><text x="700" y="300" class="m">購入時拍完整基準照片</text></g></svg>